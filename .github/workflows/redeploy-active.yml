name: Redeploy active tournaments

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Tournament source branch (does not change any app's branch)
        type: choice
        options:
          - master
          - discord
          - all
        default: master
      preview:
        description: Preview targets without deploying (uncheck to deploy)
        type: boolean
        default: true
      include_tests:
        description: Include tournament names ending in -test
        type: boolean
        default: false
      canary:
        description: First app to deploy, e.g. mittab-example (blank selects first by name)
        type: string
        default: ''
      batch_size:
        description: Concurrent deployments after the first app succeeds
        type: choice
        options:
          - '1'
          - '3'
          - '5'
        default: '3'
      force_build:
        description: Rebuild even if a previous build can be reused
        type: boolean
        default: false

permissions:
  contents: read

# A new click queues behind an existing rollout instead of canceling it midway.
concurrency:
  group: mittab-tournament-redeploy
  cancel-in-progress: false

jobs:
  redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preview or redeploy tournament apps
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          PREVIEW: ${{ inputs.preview }}
          INCLUDE_TESTS: ${{ inputs.include_tests }}
          CANARY: ${{ inputs.canary }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          args=(--branch "$TARGET_BRANCH" --batch-size "$BATCH_SIZE")
          if [[ "$PREVIEW" == 'false' ]]; then args+=(--execute); fi
          if [[ "$INCLUDE_TESTS" == 'true' ]]; then args+=(--include-tests); fi
          if [[ "$FORCE_BUILD" == 'true' ]]; then args+=(--force-build); fi
          if [[ -n "$CANARY" ]]; then args+=(--canary "$CANARY"); fi
          python -u scripts/redeploy_active.py "${args[@]}"
