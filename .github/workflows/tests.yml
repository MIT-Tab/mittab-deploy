name: Shared MySQL regression tests

on:
  pull_request:
    branches: [master]

jobs:
  mysql-regressions:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: verification
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --password=verification"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - name: Install Python dependencies
        run: pip install uv && uv sync --frozen --python 3.12
      - name: Run unit, pricing, migration and real MySQL isolation tests
        env:
          TEST_MYSQL_PORT: '3306'
          TEST_MYSQL_PASSWORD: verification
        run: uv run --frozen --python 3.12 python -m unittest discover -s tests -v
      - name: Check checkout behavior
        run: node --test tests/checkout.test.js
